.slide{min-height:610px}.task{padding:16px 18px;background:#f6f8f4;border:1px solid #e4e9df;border-radius:15px}.tasks{display:grid;gap:12px}.task-head{display:flex;align-items:flex-start;gap:13px;font-size:clamp(18px,1.8vw,23px);line-height:1.5}.number{font-size:13px;color:#b65f31;font-weight:800;padding-top:7px;min-width:24px}.task textarea{display:block;width:100%;margin-top:12px;padding:13px 15px;resize:vertical;border:1.5px solid #d5dfd3;border-radius:11px;font:inherit;font-size:18px;background:white;color:#24342c;min-height:55px}.task textarea:focus{outline:2px solid #7ea98a;border-color:#5b8b6d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.compare>div{padding:20px;background:#eaf2e9;border-radius:15px}.compare>div+div{background:#fcf0e4}.compare p{font-size:21px}.finish{font-size:23px;line-height:1.55}.download{padding:18px 24px;background:#315d47;color:white;border:0;border-radius:13px;font-size:20px;font-weight:750;cursor:pointer}.note{font-size:16px;color:#66746a}.footer{background:#fffefbf2;backdrop-filter:blur(12px);padding:14px 20px;border-top:1px solid #e4e9df;display:flex;align-items:center;justify-content:center;gap:18px}.nav{padding:13px 24px;border:1px solid #d4ded2;background:#fff;border-radius:11px;color:#315d47;font-size:17px;font-weight:750;cursor:pointer}.nav.primary{background:#315d47;color:white}.nav:disabled{opacity:.35;cursor:default}.count{font-size:16px;color:#66746a;min-width:75px;text-align:center}.slide h1{max-width:850px}@media(max-width:720px){.shell{padding:12px 12px 96px}.slide{padding:23px 18px;min-height:calc(100dvh - 170px);border-radius:17px}.duo,.groupgrid,.compare{grid-template-columns:1fr}.panel,.groupgrid>div{padding:18px}.task{padding:14px}.task-head{font-size:19px}.task textarea{font-size:17px}.footer{gap:10px}.nav{padding:12px 16px;font-size:15px}.slide h1{font-size:36px}.sub{font-size:17px}.big{font-size:22px}}
</style></head><body><div class="shell"><div class="mast"><div class="logo"><span class="symbol"></span> ENGLISH STUDIO <span style="font-weight:500;letter-spacing:0">/ HOMEWORK</span></div><div id="counter" class="counter"></div></div><div class="rail"><div class="progress" id="progress"></div></div><main id="main" class="slide"></main></div><footer class="footer"><button class="nav" id="prev" onclick="move(-1)">← Назад</button><span class="count">STATE VERBS</span><button class="nav primary" id="next" onclick="move(1)">Далее →</button></footer><script>const slides=[{"k": "GRAMMAR · 01", "t": "State verbs", "sub": "Что такое глаголы состояния", "body": "<section class=\"panel green\"><div class=\"pill\">Главное правило</div><p class=\"big\">Глаголы состояния описывают не действие, которое происходит прямо сейчас, а <strong>знания, чувства, желания, мнения, отношения и принадлежность</strong>.</p><p class=\"big\">Обычно используйте <strong>Present Simple</strong>, даже если речь идёт о настоящем моменте.</p></section><div class=\"compare\"><div><b>Верно</b><p>I understand what you mean.</p><p>She wants to leave early.</p></div><div><b>Неверно</b><p><s>I am understanding what you mean.</s></p><p><s>She is wanting to leave early.</s></p></div></div>"}, {"k": "GRAMMAR · 02", "t": "Какие глаголы запомнить", "sub": "Четыре группы", "body": "<div class=\"groupgrid\"><div><h3>Знания и память</h3><p>know — знать; understand — понимать; remember — помнить; forget — забывать</p></div><div><h3>Мнения и убеждения</h3><p>believe — верить, полагать; agree — соглашаться; doubt — сомневаться</p></div><div><h3>Желания и предпочтения</h3><p>want — хотеть; need — нуждаться; prefer — предпочитать; love — любить; hate — ненавидеть</p></div><div><h3>Принадлежность</h3><p>own — владеть; belong to — принадлежать</p></div></div>"}, {"k": "GRAMMAR · 03", "t": "Present Simple", "sub": "Утверждения, отрицания и вопросы", "body": "<div class=\"duo\"><section class=\"panel green\"><div class=\"pill\">Утверждение</div><p class=\"big\">I <b>know</b> her.</p><p class=\"big\">He <b>needs</b> some help.</p><p>После he / she / it добавьте -s / -es.</p></section><section class=\"panel orange\"><div class=\"pill\">Отрицание</div><p class=\"big\">I <b>don’t believe</b> it.</p><p class=\"big\">She <b>doesn’t want</b> to go.</p><p>После doesn’t глагол без -s.</p></section></div><div class=\"callout mint\"><b>Вопросы:</b> Do you remember his name? · Does this bag belong to you?<br><b>Сейчас:</b> I don’t understand this question. — Не используем am not understanding.</div>"}, {"k": "GRAMMAR · 04", "t": "Present Continuous", "sub": "Когда используем -ing", "body": "<section class=\"panel green\"><div class=\"pill\">Действие в процессе</div><p class=\"big\">I <b>am writing</b> an email right now.</p><p class=\"big\">They <b>are preparing</b> dinner.</p><p class=\"big\">She <b>isn’t working</b> today.</p><p class=\"big\"><b>Are</b> you <b>waiting</b> for anyone?</p></section><div class=\"callout\">Сравните: <b>I’m reading</b> the message, but I <b>don’t understand</b> it. Действие — Continuous; состояние — Simple.</div>"}, {"k": "PRACTICE · 01", "t": "Choose the form", "sub": "Впишите правильную форму глагола в скобках.", "body": "<div class=\"tasks\"><div class=\"task\"><div class=\"task-head\"><span class=\"number\">01</span><span>I ______ (not / remember) where I put my keys.</span></div><textarea aria-label=\"Ответ 1\" data-key=\"form-0\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">02</span><span>Why ______ you ______ (smile)? Did something good happen?</span></div><textarea aria-label=\"Ответ 2\" data-key=\"form-1\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">03</span><span>My brother ______ (prefer) travelling by train.</span></div><textarea aria-label=\"Ответ 3\" data-key=\"form-2\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">04</span><span>We ______ (not / watch) anything at the moment.</span></div><textarea aria-label=\"Ответ 4\" data-key=\"form-3\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">05</span><span>______ this jacket ______ (belong) to you?</span></div><textarea aria-label=\"Ответ 5\" data-key=\"form-4\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">06</span><span>I ______ (not / believe) that story.</span></div><textarea aria-label=\"Ответ 6\" data-key=\"form-5\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">07</span><span>She ______ (prepare) for a job interview this week.</span></div><textarea aria-label=\"Ответ 7\" data-key=\"form-6\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">08</span><span>He ______ (not / understand) why the meeting was cancelled.</span></div><textarea aria-label=\"Ответ 8\" data-key=\"form-7\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">09</span><span>What ______ you ______ (do) right now?</span></div><textarea aria-label=\"Ответ 9\" data-key=\"form-8\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">10</span><span>I ______ (need) a few more minutes to decide.</span></div><textarea aria-label=\"Ответ 10\" data-key=\"form-9\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">11</span><span>They ______ (not / agree) with the new policy.</span></div><textarea aria-label=\"Ответ 11\" data-key=\"form-10\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">12</span><span>My neighbour ______ (renovate) her flat this month.</span></div><textarea aria-label=\"Ответ 12\" data-key=\"form-11\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div></div>"}, {"k": "PRACTICE · 02", "t": "Correct the message", "sub": "В каждом предложении есть одна грамматическая ошибка. Исправьте её.", "body": "<div class=\"tasks\"><div class=\"task\"><div class=\"task-head\"><span class=\"number\">01</span><span>I’m not knowing anyone at this party.</span></div><textarea aria-label=\"Ответ 1\" data-key=\"fix-0\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">02</span><span>Does she wants to come with us?</span></div><textarea aria-label=\"Ответ 2\" data-key=\"fix-1\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">03</span><span>I’m needing your advice about something.</span></div><textarea aria-label=\"Ответ 3\" data-key=\"fix-2\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">04</span><span>They doesn’t believe the explanation.</span></div><textarea aria-label=\"Ответ 4\" data-key=\"fix-3\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">05</span><span>He is owning two small cafés.</span></div><textarea aria-label=\"Ответ 5\" data-key=\"fix-4\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">06</span><span>Are you remembering the name of that restaurant?</span></div><textarea aria-label=\"Ответ 6\" data-key=\"fix-5\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">07</span><span>I not understand what this email means.</span></div><textarea aria-label=\"Ответ 7\" data-key=\"fix-6\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">08</span><span>She’s working from home today, but she doesn’t answering her phone.</span></div><textarea aria-label=\"Ответ 8\" data-key=\"fix-7\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div></div>"}, {"k": "PRACTICE · 03", "t": "Complete the conversation", "sub": "Впишите подходящую форму глагола в скобках.", "body": "<div class=\"tasks\"><div class=\"task\"><div class=\"task-head\"><span class=\"number\">01</span><span>A: Why ______ you ______ (look) at the train timetable?</span></div><textarea aria-label=\"Ответ 1\" data-key=\"dialog-0\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">02</span><span>B: I ______ (want) to visit my sister this weekend.</span></div><textarea aria-label=\"Ответ 2\" data-key=\"dialog-1\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">03</span><span>A: ______ she ______ (live) in Manchester now?</span></div><textarea aria-label=\"Ответ 3\" data-key=\"dialog-2\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">04</span><span>B: Yes, but she ______ (not / like) her new flat very much.</span></div><textarea aria-label=\"Ответ 4\" data-key=\"dialog-3\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">05</span><span>A: Really? What ______ she ______ (not / like) about it?</span></div><textarea aria-label=\"Ответ 5\" data-key=\"dialog-4\" placeholder=\"Ваш ответ…\" rows=\"2\"></textarea></div><div class=\"task\"><div class=\"task-head\"><span class=\"number\">06</span><span>B: She ______ (need) more space, and the flat ______ (belong) to const main=document.getElementById('main'),counter=document.getElementById('counter'),progress=document.getElementById('progress');
function saveInputs(){document.querySelectorAll('textarea[data-key]').forEach(el=>localStorage.setItem(STORE+el.dataset.key,el.value));}
function render(){main.innerHTML='<div class="kicker">'+slides[current].k+'</div><h1>'+slides[current].t+'</h1><p class="sub">'+slides[current].sub+'</p>'+slides[current].body;counter.textContent=(current+1)+' / '+slides.length;progress.style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.querySelectorAll('textarea[data-key]').forEach(el=>{el.value=localStorage.getItem(STORE+el.dataset.key)||'';el.addEventListener('input',()=>localStorage.setItem(STORE+el.dataset.key,el.value));});window.scrollTo({top:0,behavior:'instant'});}
function move(d){saveInputs();current=Math.min(slides.length-1,Math.max(0,current+d));render();}
function downloadAnswers(){saveInputs();const out=['STATE VERBS — HOMEWORK',''];for(const s of slides){let div=document.createElement('div');div.innerHTML=s.body;const tasks=[...div.querySelectorAll('textarea[data-key]')];if(!tasks.length)continue;out.push(s.t.toUpperCase());tasks.forEach((t,i)=>{const question=t.closest('.task').querySelector('.task-head span:last-child').textContent;out.push((i+1)+'. '+question,'Answer: '+(localStorage.getItem(STORE+t.dataset.key)||'—'),'');});}const blob=new Blob([out.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='State_Verbs_Homework_Answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
